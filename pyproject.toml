[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oakenscrolls-office"
version = "0.2.0"
description = "Personal calibration ledger — where certainty gets graded. Local-first, append-only, no egress."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "textual>=0.47.0",
]

[project.optional-dependencies]
# Nestor's verified-match engine backs almanac_seam's OPTIONAL fuzzy citation
# fallback (stdlib-only; no egress). It is not yet published to PyPI, so it lives
# in an extra rather than the base install: `pip install .` succeeds without git
# access to the repo, and the ledger + TUI + exact-match citations all run. Add
# the fuzzy fallback with `pip install .[citations]`. Repin to a tag/main once
# the Nestor branch merges (and drop it into base deps once Nestor is on PyPI).
citations = [
    "nestor @ git+https://github.com/rudi193-cmd/Nestor@master",
]

[project.scripts]
oakenscrolls-office = "app:main"
